name: erp

services:
  # Laravel Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: erp_app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      # Vite dev server (HMR) for `make watch` / `pnpm run dev`
      - "5174:5174"
    volumes:
      # Live source code (development): changes are reflected without rebuild
      - .:/var/www/html
      # Keep the image-provided dependencies (WITH dev) over the bind mount
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      # Disable OPcache in development so PHP changes are picked up immediately
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - erp

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_dev
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp

networks:
  erp:
    driver: bridge

volumes:
  postgres_data:
    driver: local
